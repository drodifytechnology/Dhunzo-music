services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music_api_app
    restart: unless-stopped
    volumes:
      - ./database:/var/www/html/database
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
    networks:
      - music_network

  nginx:
    image: nginx:alpine
    container_name: music_api_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - music_network

networks:
  music_network:
    driver: bridge
